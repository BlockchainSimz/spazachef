services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.backend
    ports:
      - "8000:8000"
    volumes:
      - spazachef-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  spazachef-data:

