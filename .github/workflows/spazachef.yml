name: SpazaChef checks

on:
  push:
    paths:
      - "spazachef/**"
      - ".github/workflows/spazachef.yml"
      - ".gitignore"
  pull_request:
    paths:
      - "spazachef/**"
      - ".github/workflows/spazachef.yml"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: spazachef-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade "pip>=26.2,<27"
      - run: python -m pip install -r spazachef/backend/requirements-dev.txt
      - run: pip-audit -l
      - run: python -m pytest -q
        working-directory: spazachef/backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spazachef/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: spazachef/frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build

