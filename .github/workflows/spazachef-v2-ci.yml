name: SpazaChef v2 CI
on:
  pull_request:
    paths:
      - "spazachef-v2/**"
      - ".github/workflows/spazachef-v2-ci.yml"
  push:
    branches:
      - "codex/spazachef-v2-import-20261109"
    paths:
      - "spazachef-v2/**"
      - ".github/workflows/spazachef-v2-ci.yml"
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spazachef-v2/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spazachef-v2/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spazachef-v2/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q
